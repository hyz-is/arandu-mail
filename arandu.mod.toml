# What this package declares about itself.
#
# The declaration is capability, not intent. `aru doctor` reads the application
# and never opens an installed package, so tests/Unit/audit_test.go is what
# compares these four lines with what the code calls.

name = "hyz-is/mail"
# This package imports no framework package and no Hesape package: the floor is
# the Framework release the package template was cut from, and it moves only
# when a release of this package needs a newer one.
framework = ">= 0.66"
profiles = ["conventional", "performance"]

[permissions]
# dnsauth asks DNS resolvers for the records it checks and fetches an MTA-STS
# policy over HTTPS. Every other package here stays in the process.
network = true
# It reads no file and writes none; messages and keys arrive as arguments.
filesystem = false
# It runs no other program.
exec = false
# It owns no table: the records it builds are stored by the application.
migrations = false
